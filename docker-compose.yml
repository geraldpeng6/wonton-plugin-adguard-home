# AdGuard Home：只提供局域网 DNS，网页经云吞网关访问；DHCP 和对外加密 DNS 均关闭。
name: adguard-home

services:
  adguardhome:
    # AdGuard 官方多架构镜像（amd64、arm64），v0.107.80，GPL-3.0-only。
    image: &image adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${WONTON_APP_DATA}/config:/opt/adguardhome/conf
      - ${WONTON_APP_DATA}/work:/opt/adguardhome/work
    healthcheck:
      # 网页登录页和本机 DNS 查询都必须可用；不把可变的 admin 密码绑定到健康状态。
      test:
        - CMD-SHELL
        - >-
          wget -q -Y off -O /dev/null http://127.0.0.1:3000/login.html &&
          nslookup example.com 127.0.0.1 >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s

  # 首次创建时在本容器内跑上游安装向导 API；已有配置只校验，不覆盖主人设置。
  init:
    image: *image
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/config:/opt/adguardhome/conf
      - ${WONTON_APP_DATA}/work:/opt/adguardhome/work
    configs:
      - source: init
        target: /init.sh
    # 安装 API 只访问本容器的 127.0.0.1，不给一次性服务出网或访问局域网的能力。
    network_mode: none
    restart: "no"

configs:
  init:
    file: config/init.sh

x-wonton:
  spec: "0.4"
  id: com.adguard.adguardhome
  version: 0.1.0
  kind: app
  title: { zh: AdGuard Home, en: AdGuard Home }
  description:
    zh: 在局域网 DNS 层拦截广告和跟踪器
    en: Block ads and trackers at the DNS layer for your home network
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/AdguardTeam/AdGuardHome
  license: GPL-3.0-only
  tags:
    zh: [DNS, 广告拦截, 隐私]
    en: [DNS, Ad blocking, Privacy]
  about:
    zh: |
      在家里的 DNS 层拦截广告、跟踪器和恶意域名。把路由器的 DNS 指向这台主机的局域网地址即可覆盖家里的设备。

      插件只开放 53/tcp 和 53/udp，不启用 AdGuard Home 的 DHCP、DoH、DoT、DoQ 或 DNSCrypt 服务。网页仍在云吞网关登录后打开，应用自己的 admin 登录由核心生成的密码保护。
    en: |
      Block ads, trackers, and malicious domains at home by pointing your router's DNS to this host's LAN address.

      The plugin exposes only 53/tcp and 53/udp. AdGuard Home DHCP, DoH, DoT, DoQ, and DNSCrypt servers stay disabled. The web UI is behind the Wonton gateway and keeps AdGuard Home's own admin login with a core-generated password.
  release_notes:
    zh: "首版：只提供局域网 DNS，预置过滤清单和 DoH 上游。"
    en: "First release: LAN DNS only, with a default filter list and DoH upstream."
  webui:
    service: adguardhome
    port: 3000
    sso: none
  lan:
    ports:
      - { service: adguardhome, port: 53 }
      - { service: adguardhome, port: 53, protocol: udp }
  secrets:
    admin_password:
      generate: { bytes: 32 }
  permissions:
    # 过滤清单更新和默认 DoH 上游需要访问外网；LAN DNS 端口由 network.lan 发布。
    - network.egress
    - network.lan
  requirements:
    arch: [amd64, arm64]
    memory: 128M
