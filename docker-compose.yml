# AdGuard Home：只提供局域网 DNS，网页经云吞网关访问；DHCP 和对外加密 DNS 均关闭。
name: adguard-home

services:
  adguardhome:
    # AdGuard 官方多架构镜像（amd64、arm64），v0.107.80，GPL-3.0-only。
    image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${WONTON_APP_DATA}/config:/opt/adguardhome/conf
      - ${WONTON_APP_DATA}/work:/opt/adguardhome/work
    healthcheck:
      # 网页 API 和本机 DNS 查询都必须可用；网页登录由核心网关负责。
      test:
        - CMD-SHELL
        - >-
          wget -q -Y off -O /dev/null http://127.0.0.1:3000/control/status &&
          nslookup example.com 127.0.0.1 >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s

  # configs 不能充当可写配置；仅首次复制，保留已有配置不动。
  init:
    image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ${WONTON_APP_DATA}/config:/opt/adguardhome/conf
      - ${WONTON_APP_DATA}/work:/opt/adguardhome/work
    configs:
      - source: init
        target: /init.sh
      - source: defaults
        target: /seed/AdGuardHome.yaml
    # 初始化只写本地配置，不需要网络。
    network_mode: none
    restart: "no"

configs:
  init:
    file: config/init.sh
  defaults:
    file: config/AdGuardHome.yaml

x-wonton:
  spec: "0.4"
  id: com.adguard.adguardhome
  version: 0.1.0
  kind: app
  title: { zh: 全屋去广告（AdGuard Home）, en: Whole-Home Ad Blocker (AdGuard Home) }
  description:
    zh: 给全家的网络装一层广告过滤网：手机、电视、电脑上网页和 App 里的广告和跟踪自动挡掉。在路由器里设置一次，家里所有设备都受益。
    en: "An ad filter for your whole home network: ads and trackers in web pages and apps are blocked on every phone, TV and computer. Set it up once on your router and every device benefits."
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/AdguardTeam/AdGuardHome
  license: GPL-3.0-only
  tags:
    zh: [DNS, 广告拦截, 隐私]
    en: [DNS, Ad blocking, Privacy]
  about:
    zh: |
      在家里网络的总入口拦截广告、跟踪器和恶意网站：把路由器的 DNS 改成家里服务器的地址，家里所有设备就都覆盖了。

      插件只开放 53/tcp 和 53/udp，不启用 AdGuard Home 的 DHCP、DoH、DoT、DoQ 或 DNSCrypt 服务。网页只经云吞网关登录后访问，直接进入管理界面；不设置应用账号，不发布 3000 网页端口。
    en: |
      Block ads, trackers and malicious sites at the entrance to your home network: set your router's DNS to your home server's address and every device in the house is covered.

      The plugin exposes only 53/tcp and 53/udp. AdGuard Home DHCP, DoH, DoT, DoQ, and DNSCrypt servers stay disabled. Sign in through the Wonton gateway to open the dashboard directly, without an application account. Web port 3000 is not published.
  release_notes:
    zh: "首版：只提供局域网 DNS，预置过滤清单和 DoH 上游；网页登录仅由云吞网关负责。"
    en: "First release: LAN DNS only, with a default filter list and DoH upstream; web authentication is handled only by the Wonton gateway."
  webui:
    service: adguardhome
    port: 3000
    # none 仍校验网关会话；应用不需要身份头或自己的登录。
    sso: none
  lan:
    ports:
      - { service: adguardhome, port: 53 }
      - { service: adguardhome, port: 53, protocol: udp }
  permissions:
    # 过滤清单更新和默认 DoH 上游需要访问外网；LAN DNS 端口由 network.lan 发布。
    - network.egress
    - network.lan
  requirements:
    arch: [amd64, arm64]
    memory: 128M
